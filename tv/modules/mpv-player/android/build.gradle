plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.vkzdev.meowwatch.mpv'
version = '0.1.0'

android {
  namespace "com.vkzdev.meowwatch.mpv"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // libmpv pour Android (celle de l'appli Findroid), avec ses bibliothèques natives ARM et x86
  implementation 'dev.jdtech.mpv:libmpv:1.0.0'
}
