# Appli Windows : à chaque étiquette windows-vX.Y.Z, construit l'installateur (NSIS), signe la mise à jour et publie
# une « Release » GitHub avec latest.json, que l'appli installée consulte pour se mettre à jour toute seule.
name: Appli Windows

on:
  push:
    tags: ["windows-v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri -> target
            desktop/setup/src-tauri -> target
      - run: npm ci
        working-directory: desktop
      # Lecteur mpv : libmpv (build LGPL de zhongfly, la plus récente) et la petite DLL qui fait le lien avec le plugin.
      - name: Bibliothèques mpv
        shell: pwsh
        run: |
          $lib = "desktop/src-tauri/lib"; New-Item -ItemType Directory -Force $lib | Out-Null
          $mpv = "https://github.com/zhongfly/mpv-winbuild/releases/latest/download"
          Invoke-WebRequest "$mpv/sha256.txt" -OutFile sha256.txt
          $name = ((Get-Content sha256.txt | Where-Object { $_ -match "mpv-dev-lgpl-x86_64-" -and $_ -notmatch "v3" } | Select-Object -First 1).Trim() -split "\s+")[-1]
          Write-Host "libmpv : $name"
          Invoke-WebRequest "$mpv/$name" -OutFile mpv.7z
          7z e mpv.7z libmpv-2.dll -o"$lib" -y | Out-Null
          Invoke-WebRequest "https://github.com/nini22P/libmpv-wrapper/releases/latest/download/libmpv-wrapper-windows-x86_64.zip" -OutFile wrapper.zip
          Expand-Archive wrapper.zip -DestinationPath wrapper -Force
          Get-ChildItem wrapper -Recurse -Filter libmpv-wrapper.dll | Select-Object -First 1 | Copy-Item -Destination $lib
          Get-ChildItem $lib | Format-Table Name, Length
          if (-not (Test-Path "$lib/libmpv-2.dll") -or -not (Test-Path "$lib/libmpv-wrapper.dll")) { throw "DLL de mpv manquantes" }
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Clé privée de signature des mises à jour (Settings > Secrets and variables > Actions)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          projectPath: desktop
          tagName: windows-v__VERSION__
          releaseName: Meow Watch pour Windows __VERSION__
          releaseBody: "Télécharge « Installer-Meow-Watch.exe » ci-dessous et lance-le. Si Meow Watch est déjà installé, il se met à jour tout seul (le fichier …_x64-setup.exe sert aux mises à jour)."
          releaseDraft: false
          prerelease: false
      # Installateur au design de Meow Watch : embarque l'installateur NSIS ci-dessus (MW_SETUP) et le lance en silence.
      - name: Installateur Meow Watch
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $nsis = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $env:MW_SETUP = $nsis.FullName
          $version = (Get-Content desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Push-Location desktop/setup
          npx tauri build --no-bundle
          Pop-Location
          Copy-Item desktop/setup/src-tauri/target/release/meow-watch-setup.exe Installer-Meow-Watch.exe
          gh release upload "windows-v$version" Installer-Meow-Watch.exe --clobber --repo ${{ github.repository }}
