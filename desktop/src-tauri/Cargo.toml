[package]
name = "meow-watch"
version = "1.1.0"
description = "Meow Watch pour Windows"
edition = "2021"

[lib]
name = "meow_watch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] } # Ctrl+Maj+I : console pour diagnostiquer un flux
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Lecteur mpv intégré à la fenêtre (libmpv-2.dll + libmpv-wrapper.dll, téléchargées au build dans lib/)
tauri-plugin-libmpv = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Relais local (lecteur avancé) : petit serveur HTTP + client vers les liens debrid
tiny_http = "0.12"
ureq = "2"
getrandom = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
